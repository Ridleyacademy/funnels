<!-- ============================================================
     RIDLEY ACADEMY : SIMPLE FUNNEL, STEP 3 (the quiz)

     Where the Vidalytics player CTA lands (set the CTA to /quiz in the
     Vidalytics dashboard; nothing in this repo controls that URL).

     SIX QUESTIONS, then a route, then GO. Approved from the 14 Aug
     mockup with three decisions locked in:
       - NO NAVIGATION. No header, wordmark, footer or links out. The
         only controls are answers and a text Back. Every exit is a
         lost applicant.
       - NO CONTACT SCREEN. The front door already holds name and
         email (ridley_lead_v1); Calendly's own booking form collects
         the phone. The quiz never re-asks for anything we hold.
       - NO VERDICT SCREENS. Qualified and soft-DQ go straight to the
         calendar; hard DQ gets one soft handoff line, then the $27
         tripwire. The first cut told DQ'd people a call would waste
         their time: nobody gets told that (Chris, 14 Aug). The
         reframe is that full coursework may not fit TODAY.

     Question wording is the production qualifier's (funnel-build/
     apply.html), minus the old Q2 ("move forward?"), cut 14 Aug as
     redundant against Q1.

     ROUTING (REWRITTEN 21 Aug 2026, EXECUTION-LIST item 5. The old money
     ladder topped out at $6,000+ and its bottom option was a self-description,
     so 76% of everyone picked "Under $1,000" regardless of capacity; the
     budget gate then existed to argue with that answer. The new question asks
     the real number directly, so the gate is retired along with the ladder):
       hard DQ    Q1 = No (dormant, no No offered)   -> tripwire
       invest DQ  money = "No, that investment is
                  not currently possible"            -> tripwire
       commitment q11 <= 5/10                        -> tripwire
       soft DQ    attend = No                        -> Calendly (dq route)
       qualified  both Yes money answers             -> Calendly
     BOTH Yes answers qualify. Payment plan is NOT a lesser tier: every
     high-ticket order in the CRM was paid on a plan, first payment $200-$700.
     The two answers are tagged separately server-side so reporting can split
     them (see INVEST_TAGS in functions/api/optin.js).

     Both calendar routes use the same event today (shared.js keeps
     CAL.dq === CAL.qualified); the split survives in the payload so
     the DQ calendar can diverge later without touching this page.

     ANSWERS REACH AXL. /api/optin already forwards q1/q3..q7/q10/
     qbudget/q11/q13 as Quiz_* fields on the contact — that mapping
     predates this page and is why the closer can read the lead
     before dialling. This page posts those exact keys, keepalive,
     fire-and-forget, right before the redirect.

     EVENT LADDER (unchanged from the documented one):
       rdly_apply_start / _step / _complete{route} / _dq /
       _budget_gate / _budget_answer on dataLayer, and Meta Lead
       fires ONLY on the qualified route. CompleteRegistration
       stays the door's. Schedule moved HERE on 19 Aug when the
       calendar became an inline embed: Calendly's postMessage
       only reaches the page that embeds it, so this is now the
       only page that can know a booking happened.
     ============================================================ -->

<style>
:root{
  --cream:#FDFAF5; --cream-2:#F4EFE6; --paper:#FFFFFF;
  --cherry:#E81420; --burgundy:#B00C19; --bordeaux:#6E0717; --wine:#2B0B13;
  --ink:#2A060D; --ink-soft:#7a3a40;
  --gold:#FFB42B;
  --line:rgba(42,6,13,.14);
  --display:'Oswald',Impact,sans-serif;
  --body:'Switzer',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --gutter:clamp(20px,5vw,56px);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);color:var(--ink);line-height:1.5;
  background:
    radial-gradient(70% 45% at 50% 0%,rgba(232,20,32,.07),transparent 60%),
    linear-gradient(172deg,var(--paper) 0%,var(--cream) 60%,var(--cream-2) 100%);
  min-height:100svh;-webkit-font-smoothing:antialiased;
}
svg{display:block}

/* progress: a hairline, not a nav. Nothing on it can be clicked. */
.bar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(42,6,13,.08);z-index:5}
.bar__fill{height:100%;width:0;background:var(--cherry);transition:width .45s var(--ease)}

.stage{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:clamp(40px,7vh,72px) var(--gutter);
}
.card{width:100%;max-width:620px}

.count{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;
  font-size:11.5px;color:var(--ink-soft);margin:0 0 14px;
}
.q{
  font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(26px,4.4vw,42px);line-height:1.05;letter-spacing:.004em;
  margin:0 0 6px;color:var(--ink);text-wrap:balance;
}
.q em{font-style:normal;color:var(--cherry)}
.hint{margin:0 0 24px;font-size:15.5px;color:var(--ink-soft);max-width:46ch}

.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  font:inherit;font-size:16.5px;color:var(--ink);cursor:pointer;
  padding:17px 20px;border-radius:14px;
  background:var(--paper);border:1.5px solid var(--line);
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);
}
.opt:hover{border-color:var(--cherry);transform:translateX(3px);box-shadow:0 10px 24px -14px rgba(42,6,13,.3)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.on{border-color:var(--cherry);background:#FFF6F5}
.opt i{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);position:relative;transition:border-color .18s
}
.opt.on i{border-color:var(--cherry)}
.opt.on i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--cherry)}

.back{
  display:inline-block;margin:18px 0 0;background:none;border:0;padding:8px 2px;
  font:inherit;font-size:13.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}
.back:hover{color:var(--ink)}

.mirror{
  margin:0 0 20px;padding:16px 18px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);
  font-size:15px;color:var(--ink);
}
.mirror span{display:block;color:var(--ink-soft);font-size:13px;margin-bottom:3px}
.out .q{margin-bottom:14px}
.out p{font-size:16.5px;color:var(--ink-soft);max-width:48ch;margin:0 0 16px}

/* ---- the calendar, embedded ------------------------------------------
   The quiz used to hand the visitor to calendly.com. It now mounts the
   calendar here instead, which is what restores the booking signal: a
   Calendly postMessage only reaches a page that embeds it inline, and
   ra-ads.js has been listening for that message the whole time with
   nothing to hear. */
.card--cal{max-width:940px}
.cal{
  margin:18px 0 0;border-radius:16px;overflow:hidden;
  background:var(--paper);border:1.5px solid var(--line);
  box-shadow:0 18px 46px -30px rgba(42,6,13,.42);
}
.cal{position:relative}
.cal iframe{display:block;width:100%;height:clamp(760px,86svh,1040px);border:0;position:relative;z-index:1}
/* Calendly is a heavy SPA: measured live, the frame's own load event fires
   seconds before anything paints, and until then it is an opaque white box at
   the exact moment of highest intent. So this sits ON TOP of the frame, not
   behind it, and only lifts when Calendly says it is actually showing the
   booking page. */
.cal__wait{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  color:var(--ink-soft);font-size:15px;background:var(--paper);
  transition:opacity .3s var(--ease);
}
.cal__wait.gone{opacity:0;pointer-events:none}
.cal__wait i{
  width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);
  border-top-color:var(--cherry);animation:calspin .8s linear infinite;
}
@keyframes calspin{to{transform:rotate(360deg)}}
.cal__wait a{color:var(--cherry);text-underline-offset:3px}
.cal__fallback{
  margin:14px 0 0;font-size:13.5px;color:var(--ink-soft);text-align:center;
}
.cal__fallback a{color:var(--cherry);text-underline-offset:3px}
@media (max-width:640px){ .cal iframe{height:clamp(820px,90svh,1180px)} }
</style>

<script>
(function(){
  'use strict';

  /* the lead from the front door; every field optional, nothing gates on it */
  var lead = {};
  try { lead = JSON.parse(localStorage.getItem('ridley_lead_v1') || '{}') || {}; } catch(_){}

  var CAL = 'https://calendly.com/d/dv25-nhh-w9v/free-piano-breakthrough-session';
  var TRIPWIRE = '/tripwire.html';
  /* No price pre-frame here. Item 6 of EXECUTION-LIST-20260821 was dropped on
     Stephen's call, 21 Aug: money stays soft until the sales call. */

  function track(ev, extra){
    try {
      window.dataLayer = window.dataLayer || [];
      var p = { event: ev }; for (var k in (extra||{})) p[k] = extra[k];
      window.dataLayer.push(p);
    } catch(_){}
  }

  /* Questions. `post` is the /api/optin key the answer ships under; those keys
     are the contract with the Pages Function's QUIZ table, which forwards them
     to AXL as Quiz_* fields. Do not rename them here without renaming there.

     RECUT 2026-08-18 (Chris): NINE questions became SIX, and money moved from
     seventh to fifth so the first four are all about the piano.
       - q1 was a yes/no gate ("do you want to play real music?"). It is now the
         desire question, absorbing the old q4 ("what would you most like to be
         able to do"). Every answer moves forward: by this point they have opted
         in at the door and watched the video, so the No was near-always a
         misclick and the Yes was never in doubt.
       - q5 becomes "what's been holding you back", absorbing the old q6 (the
         worry at the back of your mind). One obstacle question, not two.
       - q3 (age group) CUT. It changed no route and the closer can ask.
       - q4 and q6 CUT into q1 and q5 above.
     Consequence: with no "No" on q1 the hard DQ is unreachable, so the $27
     tripwire is now entered only from the budget gate's "out of reach".

     `v` is optional. When present it is what gets POSTED and what the routing
     regexes match; `o` is only what the visitor reads. That split exists so q11
     could be reworded without changing the 9/10 and 10/10 values that
     /^(9|10)\// and the AXL Quiz_ fields depend on. Never edit `v`. */
  var Q = [
    { post:'q1',  q:'What have you always wanted to do at a piano and <em>never could</em>?',
      o:['Play by ear, without sheet music','Get through a whole song without stopping','Improvise and have it actually sound good','Play for someone singing'] },
    { post:'q5',  q:"What's been <em>holding you back</em>?",
      o:['Sheet music never clicked for me','I took lessons and it killed the joy','I start, then life gets in the way, then I stop',"I've taught myself bits and hit a wall","I've never been sure I'm musical enough"] },
    { post:'q7',  q:'What have you tried before?',
      o:['Apps (Simply Piano, Yousician, Flowkey...)','Lessons as a kid','Lessons as an adult','YouTube tutorials','Method books on my own','Nothing yet, this is my start'] },
    { post:'q11', q:'How soon do you want that to be <em>real</em>?',
      o:["Someday. I'm still looking around.",'This year, if someone showed me the actual path.',"I've decided. I want to start now.","Yesterday. I've put this off for years."],
      v:['5/10.','7/10.','9/10.','10/10.'] },
    /* MONEY, REWRITTEN 21 Aug 2026 (EXECUTION-LIST item 5). The old ladder
       ("Under $1,000, I'm just getting started" ... "$6,000+") anchored on
       course prices and its bottom option was a self-description, which is why
       76% of all-time applicants picked it and why intent never moved the
       answer. This asks the actual number, conditionally ("if the right fit"),
       with the payment plan as a first-class yes. Routing matches on the Yes/
       No prefixes below; the full sentence is what posts to Quiz_Investment. */
    { post:'q10', q:'If you believe the program is the right fit, are you currently in a position to invest <em>$5,997</em> in your piano education?',
      o:["Yes, I am ready and able to invest","Yes, with a payment plan","No, that investment is not currently possible"] },
    { post:'q13', q:'Once you pick your time, <em>will you be there</em>?',
      o:["Yes, I'll be there.","No, I can't promise that right now."] }
  ];

  var a = {}, i = 0, cleared = false, forceDq = false, done = false, dqTrigger = '';
  /* STARTED vs COMPLETED, 21 Aug 2026 (EXECUTION-LIST item 4). rdly_apply_start
     fires on page LOAD, which counts arrivals, not applications: someone who
     lands and leaves looks identical to someone who answers five questions and
     abandons the sixth. rdly_application_started fires once, on the first
     answer actually clicked, and rdly_application_completed on the final
     submit, so the gap between the two is finally measurable. */
  var interacted = false;
  function markStarted(){
    if (interacted) return;
    interacted = true;
    track('rdly_application_started', {});
    try { if (window.fbq) fbq('trackCustom','ApplicationStarted'); } catch(_){}
  }
  /* What the visitor actually read, keyed by post. Deliberately a separate object:
     `a` is spread into the /api/optin payload, so display text must not live in it. */
  var labels = {};
  var card = document.getElementById('card'), fill = document.getElementById('barFill');

  function prog(n){ fill.style.width = Math.round(n/(Q.length+1)*100) + '%'; }

  function render(){
    if (i >= Q.length) return finish();
    var s = Q[i];
    prog(i);
    track('rdly_apply_step', { step: i+1, key: s.post });
    /* The button they clicked said BOOK, so the page keeps saying it back
       (Chris, 14 Aug): every count line carries the booking framing, and the
       first screen says why the questions exist at all. */
    card.innerHTML =
      '<p class="count">' + (i===0 ? "You're booking your free session" : 'Booking your session') +
        ' &middot; Question ' + (i+1) + ' of ' + Q.length + '</p>' +
      '<h1 class="q">' + s.q + '</h1>' +
      (i===0 ? '<p class="hint">Six quick answers so the call starts from where you are, not from zero. Under a minute.</p>' : '') +
      '<div class="opts">' + s.o.map(function(o,n){
        return '<button type="button" class="opt" data-n="'+n+'"><i></i><span>'+o+'</span></button>';
      }).join('') + '</div>' +
      (i>0 ? '<button type="button" class="back">Back</button>' : '');
    card.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        markStarted();
        card.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on')});
        b.classList.add('on');
        a[s.post] = s.v ? s.v[b.dataset.n] : s.o[b.dataset.n];
        labels[s.post] = s.o[b.dataset.n];
        setTimeout(next, 200);
      };
    });
    var bk = card.querySelector('.back'); if (bk) bk.onclick = function(){ i--; render(); };
    try { window.scrollTo(0,0); } catch(_){}
  }

  function next(){
    /* Dormant since the 8/18 recut: q1 no longer offers a "No". Left in place so
       re-adding one restores the hard DQ without touching this function. */
    if (a.q1 && a.q1.indexOf('No') === 0){
      track('rdly_apply_dq', { dq_type:'hard', dq_trigger:'q1' });
      return landing('q1');
    }
    /* INVEST DQ, 21 Aug 2026. "No, that investment is not currently possible"
       is the only disqualifying money answer, and it disqualifies on its own:
       no gate, no argument, straight to the soft landing and the $27 first
       step. The route it ships is 'tripwire', which isDqRoute() in the worker
       already treats as a DQ, so tag 641 fires, nurture 599 lets go and the
       downsell (600) picks them up. dq_trigger 'invest' is excluded from the
       Not Ready cohort in the worker: this is a money story, not a readiness
       one, and it earns its own tag there instead.
       The budget gate below this function is DORMANT from today: it existed to
       challenge the old ladder's "Under $1,000", which no longer exists. Kept
       so restoring a challenge screen is a one-line trigger, same as q1. */
    if (Q[i].post === 'q10' && /^No/.test(a.q10 || '')) {
      track('rdly_apply_dq', { dq_type:'hard', dq_trigger:'invest' });
      return landing('invest');
    }
    i++; render();
  }

  /* the budget gate: high commitment, lowest bracket. Mirrors both answers,
     names the anchor PRODUCT.md allows, asks once. */
  function gate(){
    prog(i);
    track('rdly_apply_budget_gate', {});
    card.innerHTML =
      '<p class="count">One thing worth naming</p>' +
      '<h1 class="q">You said <em>' + (labels.q11 || a.q11 || '').replace(/\.$/,'') + '</em>, and under $1,000.</h1>' +
      '<div class="mirror"><span>Where the program actually sits</span>' +
        'Two years of weekly private lessons runs $5,200 to $10,400. This is the cheaper route, not the expensive one.</div>' +
      '<p class="hint">Which is closer to the truth for you?</p>' +
      '<div class="opts">' +
        '<button type="button" class="opt" data-r="ok"><i></i><span>If the plan was right, I could make that work.</span></button>' +
        '<button type="button" class="opt" data-r="later"><i></i><span>Not right now, but I still want the call.</span></button>' +
        '<button type="button" class="opt" data-r="no"><i></i><span>No, that\'s out of reach for me.</span></button>' +
      '</div>';
    card.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        a.qbudget = b.dataset.r;          /* code: ok | later | no. The retired apply.html
                                             wrote "can" for this first option; what is
                                             posted from here is "ok". */
        a.qbudgetText = b.querySelector('span').textContent;
        track('rdly_apply_budget_answer', { answer: b.dataset.r });
        if (b.dataset.r === 'ok'){ cleared = true; i++; return render(); }
        if (b.dataset.r === 'later'){ forceDq = true; i++; return render(); }
        track('rdly_apply_dq', { dq_type:'hard', dq_trigger:'budget' });
        landing('budget');
      };
    });
  }

  /* one POST for every route, right before leaving. keepalive so the request
     survives the navigation. No email in storage means nothing to attach the
     answers to, so we skip rather than create a ghost contact. */
  function ship(route){
    if (!lead.email) return;
    /* ANSWERS GO TOP-LEVEL, alongside email and source. The handler does
       `quiz: d` — it assigns the WHOLE POST body as lead.quiz — so lead.quiz.q1
       resolves only when q1 is a top-level key. Nesting them under a `quiz`
       object produces lead.quiz.quiz.q1 and every answer is silently dropped:
       the contact is still created, tags still apply, and Quiz_Answers comes
       back holding nothing but "Route: qualified". Verified in the AXL UI on
       14 Aug, after I briefly "fixed" this the wrong way round. */
    var p = {
      name: lead.name || '', email: lead.email,
      source: 'quiz', route: route, consent: true
    };
    for (var k in a) p[k] = a[k];
    /* the budget gate's answer travels as its own code for cohortTags() */
    if (a.qbudget) p.qbudget = a.qbudget;
    /* and so does the reason a hard DQ fired, under the key the worker reads */
    if (dqTrigger) p.dq_trigger = dqTrigger;
    /* URL FIRST, stored lead second. Added 2026-08-18 with the watch.html change
       that carries ad parameters across the hop. The stored lead can be STALE: the
       door only rewrites ridley_lead_v1 when its form is submitted, so a returning
       visitor who clicks a new ad still has the previous visit's utm_source sitting
       in localStorage. Whatever is on this URL came from the click that is being
       paid for right now, so it wins. The stored value remains the fallback for
       anyone who reached the quiz without parameters. */
    var urlSource = '';
    try { urlSource = new URLSearchParams(location.search).get('utm_source') || ''; } catch(_){}
    var src = urlSource || lead.utm_source;
    if (src) p.utm_source = src;
    /* THE FULL SET, 21 Aug 2026: campaign, ad set, ad, creative ids, placement,
       click ids, device, and first touch under ft_*. ra-attrib.js already
       implements the URL-first rule described above (a fresh click with params
       overwrites last touch; internal hops never blank it), so its values are
       applied AFTER the single-key fallback and win where both exist. This is
       the write that puts attribution ON THE APPLICATION, which is the join
       that 83 of 85 applications were missing. */
    try {
      if (window.RAAttrib) {
        var af = RAAttrib.optinFields();
        for (var ak in af) p[ak] = af[ak];
      }
    } catch(_){}
    try {
      fetch('/api/optin', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(p), keepalive: true
      }).catch(function(){});
    } catch(_){}
  }

  function finish(){
    if (done) return;
    /* COMMITMENT FLOOR, Chris 19 Aug. 5/10 or below is someone still looking
       around, and until now they reached the calendar: the budget gate is the
       only other hard exit and it opens at 9-10/10, so the least committed
       applicants were the ones nothing ever stopped. A 5/10 with no money behind
       it booked a Breakthrough Session on 19 Aug; that is what this closes.
       Read off q11's stored value ("5/10." / "7/10." / "9/10." / "10/10."), the
       only numeric scale in the quiz, so re-wording an option cannot break it.
       An unanswered q11 parses to NaN and does NOT dq. Runs before `done` is set,
       because landing() owns that latch and would return early otherwise. */
    if (parseInt(a.q11, 10) <= 5) {
      track('rdly_apply_dq', { dq_type:'hard', dq_trigger:'commitment' });
      return landing('commitment');
    }
    done = true;
    prog(Q.length + 1);
    /* The old "Under $1,000 uncleared" soft-DQ went with the ladder on 21 Aug:
       a disqualifying money answer now exits in next() before reaching here.
       What remains soft is the budget gate's "not right now" (dormant path)
       and someone who will not promise to show up. */
    var soft = forceDq || /^No/.test(a.q13 || '');
    var route = soft ? 'dq' : 'qualified';
    track('rdly_apply_complete', { route: route });
    /* APPLICATION COMPLETED, as its own event and distinct from STARTED (see
       the first-interaction hook near render()). Fires on every completed
       path, qualified or soft, so completion can be counted without mixing
       in routing. 21 Aug 2026, EXECUTION-LIST item 4. */
    track('rdly_application_completed', { route: route });
    try { if (window.fbq) fbq('trackCustom','ApplicationCompleted',{route: route}); } catch(_){}
    /* FINANCIALLY QUALIFIED is its own signal: either Yes on the money
       question, however the rest routed. This is the event the Meta account
       is eventually meant to learn on (EXECUTION-LIST items 2 and 10). */
    if (/^Yes/.test(a.q10 || '')) {
      var plan = /payment plan/.test(a.q10) ? 'payment_plan' : 'full';
      track('rdly_financially_qualified', { how: plan });
      try { if (window.fbq) fbq('trackCustom','FinanciallyQualified',{how: plan}); } catch(_){}
    }
    /* Lead is reserved for a finished, qualified application: the door already
       fired CompleteRegistration. Schedule fires further down, off Calendly's
       event_scheduled message, not here. */
    if (!soft) { try { if (window.fbq) fbq('track','Lead',{content_name:'Quiz Qualified'}); } catch(_){} }
    ship(route);
    mountCalendar(route);
  }

  /* Mount the calendar in the page rather than sending the visitor to
     calendly.com.

     This is the fix for a booking signal that has been dark for weeks.
     Calendly emits `calendly.event_scheduled` as a postMessage to its PARENT
     window, so it only ever arrives on a page that embeds the calendar
     inline. booking.html used to be that page; when it was retired and the
     funnel started linking straight out to calendly.com, both the Meta
     Schedule event and the Google booked-call conversion went dark with it,
     silently. ra-ads.js still carries the listener (see its onMessage), so
     embedding here is all it takes to give it something to hear.

     embed_domain and embed_type are not decoration: Calendly only posts back
     to the parent when it knows it is running embedded. Without them the
     iframe renders and the message never arrives. */
  /* `route` is finish()'s computed one. It used to be re-derived here as
     `forceDq ? 'dq' : 'qualified'`, but forceDq is set only by the budget gate's
     "not right now", so every soft DQ that came from the budget bracket or from
     "I can't promise" reported itself as qualified on this one event. */
  function mountCalendar(route){
    var q = '?hide_gdpr_banner=1&embed_type=Inline&embed_domain=' +
            encodeURIComponent(location.hostname);
    if (lead.name)  q += '&name='  + encodeURIComponent(lead.name);
    if (lead.email) q += '&email=' + encodeURIComponent(lead.email);
    /* carries the ad click id onto the booking record for offline upload */
    try { if (window.RAAds && RAAds.calendlyParams) q += RAAds.calendlyParams(); } catch(_){}
    /* and the utm set (last touch), so the BOOKING carries the same campaign /
       ad set / ad the application does. Calendly stores these five on the
       invitee record; before 21 Aug 2026 bookings carried nothing. */
    try { if (window.RAAttrib && RAAttrib.calendlyParams) q += RAAttrib.calendlyParams(); } catch(_){}

    card.className = 'card card--cal';
    card.innerHTML =
      '<div class="out">' +
        '<h1 class="q">Pick your <em>time</em></h1>' +
        '<p>Thirty minutes, a conversation, not a checkout.</p>' +
      '</div>' +
      '<div class="cal">' +
        '<div class="cal__wait" id="calWait"><i></i><span>Loading your calendar&hellip;</span>' +
          '<span>Taking too long? <a href="custom-time.html">Request a time instead</a>.</span>' +
        '</div>' +
        '<iframe title="Book your Breakthrough Session" ' +
          'src="' + CAL + q + '" frameborder="0"></iframe>' +
      '</div>' +
      '<p class="cal__fallback">Calendar not loading? ' +
        '<a href="' + CAL + q + '" target="_blank" rel="noopener">Open it in a new tab</a>.</p>';
    /* Lift the cover when Calendly is genuinely showing the booking page.
       Its own iframe load event is useless for this: it fires on document
       load, well before the app paints. calendly.event_type_viewed is the
       first message it sends once the page is up. The timeout is a safety
       net so a message that never arrives cannot leave a visitor stuck
       behind a spinner with a working calendar underneath it. */
    var wait = card.querySelector('#calWait');
    if (wait) {
      var lift = function(){ wait.classList.add('gone'); };
      window.addEventListener('message', function(e){
        if (e && typeof e.origin === 'string' && e.origin.indexOf('calendly.com') !== -1 &&
            e.data && typeof e.data === 'object' &&
            String(e.data.event || '').indexOf('calendly.') === 0) lift();
      }, false);
      setTimeout(lift, 12000);
    }
    track('rdly_calendar_mounted', { route: route });
  }

  /* The booking itself. Fires Meta's Schedule from the parent window and then
     moves the parent to the confirmation page.

     Two things this deliberately does NOT rely on:
       - Calendly's own after-booking redirect. When the calendar is embedded
         that redirect navigates the IFRAME, so the confirmation page loads
         inside the frame and the top window never moves. Driving the parent
         from the message makes the outcome the same either way.
       - thank-you.html firing the conversion. It fires Schedule and the
         Google booked-call on load, which is right when Calendly redirected
         to it directly. Reaching it from here would double count, so the
         parent hands over `?booked=1` and thank-you.html stands down.
     Google's side needs nothing here: ra-ads.js fires callBooked off the same
     message and carries its own guard. */
  var scheduled = false;
  window.addEventListener('message', function(e){
    if (!e || typeof e.origin !== 'string' || e.origin.indexOf('calendly.com') === -1) return;
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.event !== 'calendly.event_scheduled') return;
    if (scheduled) return;
    scheduled = true;
    try { if (window.fbq) fbq('track','Schedule',{content_name:'Free piano consultation'}); } catch(_){}
    track('rdly_booking_confirmed', { source:'quiz_embed' });
    setTimeout(function(){ window.location.href = '/thank-you.html?booked=1'; }, 600);
  }, false);

  /* hard DQ: one soft line, then the smaller first step. Never a verdict.
     `trigger` names the answer that stopped them and is posted as dq_trigger.
     The worker already reads that key (it was apply.html's) and routes on it:
     anything other than 'budget' earns the Not Ready cohort tag. This page never
     sent it, so every hard DQ from here landed in AXL with no cohort at all. */
  function landing(trigger){
    if (done) return; done = true;
    dqTrigger = trigger || '';
    prog(Q.length + 1);
    track('rdly_apply_complete', { route: 'tripwire' });
    ship('tripwire');
    card.innerHTML =
      '<div class="out">' +
        '<h1 class="q">One step <em>at a time</em></h1>' +
        '<p>Maybe full-on coursework is not the right fit just yet, and that is completely fine. There is a smaller way in, and it starts with the songs, not the theory.</p>' +
      '</div>';
    setTimeout(function(){ window.location.href = TRIPWIRE; }, 1400);
  }

  track('rdly_apply_start', { page:'quiz' });
  render();
})();
</script>

</body>
</html>

<!-- ============================================================
     FRONT DOOR handler. Loads after main.js/funnel.js so the booking
     form is already wired when the door lifts.

     On submit, in this order:
       1. validate (name, email, phone)
       2. write ridley_lead_v1, the same store the booking form reads,
          so the form underneath is already filled in
       3. POST /api/optin  (fire and forget, keepalive)
       4. fbq CompleteRegistration + dataLayer rdly_optin
       5. lift the door, prefill the booking form, restart the VSL
          from 0 WITH SOUND so the free video begins the moment
          they land. One video, played in full, exactly what the
          door promised.

     The reveal never waits on the network. If /api/optin is down the
     visitor still gets through; only the AC write is lost.
     ============================================================ -->
<script>
(function () {
  var form = document.getElementById('doorForm');
  var door = document.getElementById('door');
  if (!form || !door) return;
  var btn = document.getElementById('doorBtn');
  var root = document.documentElement;

  function val(n) { return (form[n] && form[n].value || '').trim(); }
  function bad(n) {
    var el = form[n];
    if (!el) return;
    el.classList.add('is-bad');
    el.focus();
  }
  var CHECKS = {
    name:  function (v) { return v.length >= 2; },
    email: function (v) { return /\S+@\S+\.\S+/.test(v); },
    phone: function (v) { return v.replace(/\D/g, '').length >= 7; }
  };
  Object.keys(CHECKS).forEach(function (n) {
    var el = form[n];
    if (!el) return;
    el.addEventListener('input', function () {
      var ok = CHECKS[n](el.value.trim());
      el.classList.toggle('is-valid', ok);
      if (ok) el.classList.remove('is-bad');
    });
  });

  /* KNOWN LEAD, RETURNING. The gate is now the first view on every visit,
     so someone who already opted in would otherwise have to type their
     details again to re-watch. Pre-fill from the store they wrote last
     time: the gate still stands in front of the video, but clearing it
     costs one tap. */
  var prior = {};
  try { prior = JSON.parse(localStorage.getItem('ridley_lead_v1') || '{}'); } catch (e) {}
  var known = !!(prior && prior.email);

  if (known) {
    ['name', 'email', 'phone'].forEach(function (n) {
      var el = form[n];
      if (el && prior[n] && !el.value) {
        el.value = prior[n];
        el.classList.add('is-valid');
      }
    });

    /* RE-ENTRY. They are past the gate already, so let them choose to go
       straight back to the video instead of submitting a second time.
       No capture, no pixel: this is a re-watch, not a new lead. */
    var again = document.getElementById('doorAgain');
    var againBtn = document.getElementById('doorAgainBtn');
    if (again) again.hidden = false;
    if (againBtn) againBtn.addEventListener('click', function () {
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_optin_repeat', optin_source: 'front-door-reentry', page_variant: 'vsl-b' }); } catch (e) {}
      open(prior);
    });
  }

  /* The poster is a real button, so make it do the honest thing: send them
     to the first field still to fill, rather than pretending to play a
     video that is gated. */
  var vid = document.getElementById('doorVid');
  if (vid) vid.addEventListener('click', function () {
    var next = ['name', 'email', 'phone'].map(function (n) { return form[n]; })
      .filter(Boolean).filter(function (el) { return !CHECKS[el.name](el.value.trim()); })[0];
    if (next) next.focus(); else if (btn) btn.focus();
  });

  /* Lift the door and hand the visitor straight into the free video. */
  function open(lead) {
    /* drop is-door, add is-opted: that swap is what hides the page's own
       hero CTA and puts the two-way choice in its place. The pre-paint
       bootstrap sets is-opted on any LATER visit; this covers the visit
       where they actually opt in. */
    root.className = (' ' + root.className + ' ')
      .replace(' is-door ', ' ')
      .replace(/^\s+|\s+$/g, '') + ' is-opted';

    /* fill the booking form underneath and let main.js react to it:
       dispatching a real input event is what triggers its own
       validity + qualifying-question logic, so nothing there changes. */
    try {
      var f = document.getElementById('bookForm');
      if (f) {
        [['name', lead.name], ['email', lead.email], ['phone', lead.phone]].forEach(function (p) {
          var el = f.querySelector('[name="' + p[0] + '"]');
          if (el && p[1]) {
            el.value = p[1];
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
        var c = f.querySelector('.book__consent input');
        if (c && lead.consent) { c.checked = true; c.dispatchEvent(new Event('change', { bubbles: true })); }
      }
    } catch (e) {}

    /* the free video = the VSL, restarted from 0 with sound. #vslSound is the
       page's own pill and already owns that behaviour on both the native
       and the YouTube player, so we click it rather than duplicate it. */
    setTimeout(function () {
      /* main.js writes its OWN ridley_lead_v1 in response to the input
         events above (adding cc/ccIso/q1/q2), and its object has no
         notion of the door's SMS consent, so it lands as consent:false.
         The booking form has no consent checkbox of its own, which makes
         the door the only place that value is ever collected. Merge it
         back on top once main.js has finished writing. */
      try {
        var cur = JSON.parse(localStorage.getItem('ridley_lead_v1') || '{}');
        if (cur.consent !== lead.consent) {
          cur.consent = lead.consent;
          localStorage.setItem('ridley_lead_v1', JSON.stringify(cur));
        }
      } catch (e) {}
      try {
        var pill = document.getElementById('vslSound');
        if (pill) pill.click();
      } catch (e) {}
      try { window.scrollTo(0, 0); } catch (e) {}
    }, 60);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = val('name'), email = val('email'), phone = val('phone');
    if (!CHECKS.name(name))   return bad('name');
    if (!CHECKS.email(email)) return bad('email');
    if (!CHECKS.phone(phone)) return bad('phone');
    var consent = !!(form.consent && form.consent.checked);
    var lead = { name: name, email: email, phone: phone, consent: consent };

    if (btn) { btn.disabled = true; btn.textContent = 'Starting your video…'; }

    try { localStorage.setItem('ridley_lead_v1', JSON.stringify(lead)); } catch (err) {}

    /* Because the gate now shows on EVERY visit, the same person can clear
       it repeatedly. Capture and CompleteRegistration must fire once per
       email, or a returning visitor inflates the pixel's optimisation
       signal and writes AC a duplicate on every re-watch. */
    var already = false;
    try { already = localStorage.getItem('ridley_optin_sent_v1') === email; } catch (err) {}
    if (!already) { try { localStorage.setItem('ridley_optin_sent_v1', email); } catch (err) {} }

    /* AC capture. Fire and forget so a slow or dead endpoint never holds
       the visitor at the door. NOTE: /api/optin currently returns 405 in
       production because the Pages Function is not deployed yet, so this
       write is silently lost until that ships. See README. */
    if (!already) {
      try {
        fetch('/api/optin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(lead),
          keepalive: true
        }).catch(function () {});
      } catch (err) {}

      /* CompleteRegistration, NOT Lead. Lead stays on the booking path so
         vsl-a and vsl-b keep optimising toward the same event. */
      try { if (window.fbq) window.fbq('track', 'CompleteRegistration', { content_name: 'Free video', content_category: 'front-door' }); } catch (err) {}
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_optin', optin_source: 'front-door', page_variant: 'vsl-b' }); } catch (err) {}
    } else {
      /* Re-watch by a known lead. Worth seeing in GA, worth keeping out of
         the pixel and out of ActiveCampaign. */
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_optin_repeat', optin_source: 'front-door', page_variant: 'vsl-b' }); } catch (err) {}
    }

    open(lead);
  });

  /* ---- POST-VIDEO CHOICE ------------------------------------------
     One tap from the video to the calendar. Everything Calendly needs
     we already hold, so it goes across as prefill instead of being
     re-typed. Lead fires here because this replaces the page's booking
     form for opted-in visitors, and the ladder has to stay intact:
     CompleteRegistration (door) -> Lead (this) -> Schedule (Calendly).  */
  var CAL = 'https://calendly.com/d/dv25-nhh-w9v/free-piano-consultation';
  var book = document.getElementById('choiceBook');
  var later = document.getElementById('choiceLater');

  function lead$() {
    try { return JSON.parse(localStorage.getItem('ridley_lead_v1') || '{}'); }
    catch (e) { return {}; }
  }

  /* Query-string prefill. Used by the inline embed and by the navigate
     fallback, so both carry the same details.
     `a1` is Calendly's first custom question. On this event that is the
     phone field; if it ever is not, Calendly ignores the value and simply
     asks, so this can never write an answer into the wrong question.
     Deliberately no `month=` param: pinning a month would silently point
     at a past calendar as soon as it rolls over. */
  function prefillQS(l) {
    var q = [];
    if (l.name)  q.push('name='  + encodeURIComponent(l.name));
    if (l.email) q.push('email=' + encodeURIComponent(l.email));
    if (l.phone) q.push('a1='    + encodeURIComponent(l.phone));
    return q.length ? '?' + q.join('&') : '';
  }

  if (book) book.addEventListener('click', function () {
    var l = lead$();
    try { if (window.fbq) window.fbq('track', 'Lead', { content_name: 'Free Piano Consultation', content_category: 'post-video-choice' }); } catch (e) {}
    try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_book_click', source: 'post-video-choice', page_variant: 'vsl-b' }); } catch (e) {}

    var host = document.getElementById('choiceCalHost');
    var wrap = document.getElementById('choiceCal');
    if (!host || !wrap) { window.location.href = CAL + prefillQS(l); return; }

    function mount() {
      try {
        window.Calendly.initInlineWidget({
          url: CAL + '?hide_gdpr_banner=1',
          parentElement: host,
          prefill: {
            name: l.name || '',
            email: l.email || '',
            customAnswers: l.phone ? { a1: l.phone } : {}
          }
        });
        wrap.hidden = false;
        root.className += ' is-booking';
        setTimeout(function () {
          try { wrap.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
        }, 80);
      } catch (e) {
        window.location.href = CAL + prefillQS(l);
      }
    }

    /* widget.js is loaded async in the page head, so on a fast click it is
       often not ready yet. Wait for it rather than bouncing them off the
       page: poll briefly, and only navigate if it genuinely never arrives.
       The button says so meanwhile, so the tap is never a dead one. */
    if (window.Calendly) { mount(); return; }

    book.disabled = true;
    var was = book.textContent;
    book.textContent = 'Opening the calendar…';
    var waited = 0;
    var poll = setInterval(function () {
      if (window.Calendly) {
        clearInterval(poll);
        book.disabled = false; book.textContent = was;
        mount();
      } else if ((waited += 100) >= 5000) {
        clearInterval(poll);
        window.location.href = CAL + prefillQS(l);
      }
    }, 100);
  });

  /* Booking itself is NOT tracked here. main.js already listens for
     `calendly.event_scheduled` and moves them to /thank-you, and that page
     is where the Meta Schedule conversion fires (Ori, 7/27: base pixel
     everywhere, Schedule on thank-you only). Firing it here as well would
     double-count every booking. This listener only records the moment in
     the dataLayer so the embed's own funnel is visible in GA. */
  window.addEventListener('message', function (e) {
    if (!e || !e.data || typeof e.data !== 'object') return;
    if (e.data.event === 'calendly.event_scheduled') {
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_call_booked', source: 'post-video-embed', page_variant: 'vsl-b' }); } catch (err) {}
    }
  });

  if (later) later.addEventListener('click', function () {
    try { (window.dataLayer = window.dataLayer || []).push({ event: 'rdly_not_ready', source: 'post-video-choice', page_variant: 'vsl-b' }); } catch (e) {}
    /* href="/tripwire" carries the navigation, so nothing is preventDefault'd
       here: if the dataLayer push throws, the visitor still gets there. */
  });
})();
</script>

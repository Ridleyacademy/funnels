<!-- ============================================================
     RIDLEY ACADEMY : SIMPLE FUNNEL, STEP 2 (the VSL)

     TWO THINGS ON THIS PAGE. A headline and a video. That is the
     whole design, and it is a deliberate strip-back over several
     passes on Chris's call (12 Aug), matching the reference VSL.

     Removed, and none of it drifts back without him asking: the
     wordmark bar, the stats row, the Trustpilot captures, the pull
     quote, both CTA bands, the keybed, the legal line, and finally
     the button itself with its chevrons and reassurance line.

     THIS PAGE HAS NO CALL TO ACTION IN THE MARKUP, BY DESIGN. The
     ask comes from inside the Vidalytics player, which carries its
     own timed automations (confirmed by Chris, 12 Aug). That is why
     removing the button is safe here and would not be on a page
     whose video was a plain embed.

     Consequences to hold on to:
       - The player is the conversion path. If those automations are
         ever switched off in Vidalytics, this page silently stops
         converting and nothing in the markup will show it.
       - .player sets overflow:hidden for the 26px radius. Anything
         the player renders OUTSIDE its own box would be clipped. In
         -player CTAs are fine; if a sticky or expanding overlay is
         ever configured, drop the overflow rule.
       - The lead is still in localStorage under ridley_lead_v1 and
         the canonical calendar is dv25-nhh-w9v, so a markup CTA can
         be wired back in minutes if the in-player one is dropped.

     Terms and Privacy live on index.html, the page that actually
     collects the data and therefore the one ad platforms check.

     NOT GATED, DELIBERATELY. It would be easy to bounce anyone
     without ridley_lead_v1 back to the opt-in, and it would be a
     mistake: the opt-in writes that key and redirects 220ms later,
     so any visitor whose localStorage write failed (private mode,
     storage disabled, quota) would land here, get sent back, opt in
     again, and loop forever. We READ the lead to prefill the
     calendar and never require it.

     THE VIDEO is a Vidalytics embed (id 7pHY_IXbYK7t5bna, account
     PFCksb55), pasted verbatim. It ships its own 56.25% padding-top
     aspect box, so it is never wrapped in a second aspect container.

     Swapping the video means changing the id in THREE places below:
     the div id, the run() argument, and the embed URL. Miss one and
     the loader runs against a container that is not there, leaving a
     blank box and no console error.

     THE CTA lives entirely inside the player and goes to /quiz. Corrected
     2026-08-18: this block used to say "straight to Calendly", which was true
     for one day in August and then stopped being true when quiz.html took over
     as step 3. That stale sentence cost a session's work, because it reads like
     documentation and is actually a claim about a setting in someone else's
     dashboard. The path is capture, watch, QUIZ, Calendly.

     The CTA target is NOT in this repo and nothing here controls it. To read
     what it actually points at, load this page and inspect:
       _vidalytics.embeds['vidalytics_embed_7pHY_IXbYK7t5bna']
         .options.ui.callToActions.<id>.link.href
     On 2026-08-18 that was https://vsl-b.ridleyacademy.team/quiz. Check it
     before believing any sentence in this file about where the CTA goes.

     One consequence that is NOT visible in this file and will not announce
     itself:

       1. NOTHING FIRES META Schedule ANY MORE. The listener lived in
          shared.js, which booking.html loaded; it caught Calendly's
          event_scheduled postMessage from the embed and sent the visitor to
          thank-you.html, which is the page that fires Schedule. Sending them
          to calendly.com directly means no embed, no postMessage, no listener
          and no Schedule. The fix is not code: set the Calendly event to
          redirect to thank-you.html after booking, and Schedule fires there
          exactly as before. Until that is set, booked calls are invisible to
          Meta and booked.html is never reached.
       (Prefilling Calendly is no longer this page's problem: quiz.html appends
       name and email from ridley_lead_v1 when it builds the calendar URL.)
     ============================================================ -->

<style>
:root{
  --cream:#FDFAF5; --cream-2:#F4EFE6; --paper:#FFFFFF;

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

/* ============ STAGE ============
   One screen, centred, nothing chrome-like around it. min-height uses svh
   so iOS toolbars cannot push the button under the browser chrome. */
.stage{
  position:relative;overflow:hidden;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  /* 40px ceiling, not 56: at 56 the page overflowed a 1440x900 laptop by 29px,
     which is the worst kind of miss, a scrollbar for the sake of padding. */
  padding:clamp(24px,3.4vw,40px) var(--gutter);
  background:
    radial-gradient(72% 48% at 50% 2%,rgba(232,20,32,.10),transparent 62%),
    linear-gradient(178deg,var(--paper) 0%,var(--cream) 66%,var(--cream-2) 100%);
}
/* the dashed sweep, carried from the landing page and from the reference.
   Decoration only, and it never overlaps the player. */
.stage::before{
  content:"";position:absolute;right:-24%;top:-38%;
  width:min(1100px,86vw);aspect-ratio:1;
  border:2px dashed rgba(232,20,32,.17);border-radius:50%;pointer-events:none;
}
@media(max-width:760px){.stage::before{right:-52%;top:-16%;width:150vw}}

.col{position:relative;z-index:1;width:100%;max-width:940px;text-align:center}

/* ---- the headline. The reason the page exists. ---- */
.h1{
  font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(27px,3.9vw,50px);line-height:1.03;letter-spacing:.004em;
  margin:0 auto clamp(22px,3.2vw,34px);color:var(--ink);
  text-wrap:balance;max-width:22ch;
}
/* emphasis by colour, not by caps: the face is already all-caps, so caps
   cannot carry emphasis here the way they do in the reference. */
.h1 em{font-style:normal;color:var(--cherry)}

/* ---- the player ----
   Vidalytics ships its own aspect box on the embed div; this is only the
   frame. 26px is the DESIGN.md radius for large media. */
/* THE PLAYER IS CAPPED BY VIEWPORT HEIGHT AS WELL AS WIDTH: the width comes
   from whatever height is left once the headline, its gap and the padding are
   paid for, divided by 16:9. Sizing on width alone put it under the fold.

   The reserve dropped from 400 to 300 and the ceiling rose from 780 to 900
   when the button and note came off. With only two elements left the video
   should take the room they freed, not leave it as dead space. */
/* NO BACKGROUND, NO OVERFLOW, NO BORDER ON THIS ELEMENT, and that is load
   bearing. The embed renders TWO things stacked: the 16:9 video, and below it
   a CallToActionsManager strip (~70px) holding the CTA the Vidalytics
   automation fires. Styling this wrapper as a card broke both:
     - background:#000 painted a black bar behind the CTA strip, which is what
       read as a "weird frame" under the video on phones
     - overflow:hidden clipped the CTA button itself, which Vidalytics renders
       WIDER than its own container (356px inside 337px on a 375px screen)
   So the frame moves onto the video surface only, below. Never put a
   background, a border or an overflow rule back on .player. */
.player{
  position:relative;margin:0 auto;
  max-width:min(900px, calc((100svh - 300px) * 1.78));
}
/* The video surface is the embed's first child (Vidalytics' Tech__wrapper).
   Targeted structurally rather than by their class name, which is minified and
   free to change. If a future player build reorders its children this simply
   stops applying: the video loses its rounded corners and nothing breaks. */
.player > div > div:first-child{
  border-radius:26px;overflow:hidden;
  box-shadow:0 42px 84px -36px rgba(42,6,13,.55), 0 4px 14px -6px rgba(42,6,13,.26);
}

/* NO BUTTON ON THIS PAGE. Removed 12 Aug on Chris's call, along with the
   chevrons and the reassurance line under them. Two elements now: headline and
   video. The call to action has to come from inside the Vidalytics player on a
   timer, because there is nothing else on the page that can carry it. If the
   player is not configured with one, this page converts nobody. */

/* SHORT VIEWPORTS (1366x768 and every 13" laptop). Height, not width, is what
   runs out here: at full size the four-line headline alone is 206px and the
   page overflowed by 90. Trimming the type and the padding buys enough back to
   hold one screen AND lets the player grow, which is the right way round. The
   video should never pay for the headline. */
/* PHONES: no frame at all. Chris's call, 12 Aug. The rounded corners and the
   drop shadow read as a card floating on the page at phone width, where the
   video is nearly full-bleed anyway and there is no room for the frame to be
   a considered edge rather than clutter. */
@media(max-width:760px){
  .player > div > div:first-child{border-radius:0;box-shadow:none}
  /* FULL BLEED, AND IT IS THE CTA THAT FORCES IT. Vidalytics renders its CTA
     button at a FIXED 356px. Inside the normal 18px gutters the player is only
     339px on a 375px phone, so the button hung 8px past the video on both
     sides and read as broken. Their button is centred with an absolute left
     plus a translate computed from that fixed width, so clamping its width
     breaks the centring; widening the container is the fix that does not fight
     them. 375px of player leaves the 356px button a clean 9px each side, and a
     full-bleed video is the right look on a phone anyway. */
  .player{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
}

@media(max-height:830px) and (min-width:761px){
  .stage{padding-top:26px;padding-bottom:26px}
  .h1{font-size:clamp(24px,3.1vw,38px);margin-bottom:20px}
  .player{max-width:min(900px, calc((100svh - 230px) * 1.78))}
}

/* NO LEGAL LINE, NO FOOTER, NO WORDMARK. Removed on Chris's call, 12 Aug:
   three things on this page and nothing else. Terms and Privacy still live on
   index.html, which is where data is actually collected and therefore where
   ad-platform policy looks for them. Do not reintroduce a footer here. */

/* ---- THE CTA GATE (21 Aug 2026, EXECUTION-LIST item 4) --------------------
   The Vidalytics dashboard shows the in-player CTA from 90 seconds, which is
   6 minutes 14 seconds BEFORE the video says what the program is (premium
   block at 7:44 of the 15:30 master). Measured result: 283 of 333 CTA views
   clicked, almost all before the pitch, which is the machine that makes
   unqualified applications. The dashboard timing is not in this repo, so the
   page holds its own gate: every Vidalytics CTA anchor stays hidden until the
   script below has seen the video reach APPLY_CTA_REVEAL_SECONDS, then the
   html element gets .ra-cta-open and the CTA appears. Display, with
   !important, beats any inline style the player sets. */
html:not(.ra-cta-open) a[id^="vid_cta-"]{display:none !important}
</style>

<script>
/* ============================================================
   Tracking only. The Calendly prefill that used to live here went
   with the button: there is no longer anything on the page to
   prefill. If a CTA is added back, inside the player or otherwise,
   the lead is still in localStorage under ridley_lead_v1 and the
   canonical calendar is dv25-nhh-w9v.
   ============================================================ */
(function(){
  /* ============================================================
     THE PLAYER'S CTA: prefill it, and make it open exactly once.

     Vidalytics renders its CTA as <a target="_blank"> pointing at a fixed URL
     set in their dashboard. Two problems with leaving it alone: it cannot know
     who the visitor is, and a request for a NEW WINDOW is unreliable inside the
     Instagram and Facebook in-app browsers this funnel's traffic arrives in.

     This handler rewrites the href to carry the lead and drops the target, then
     gets out of the way. It opens nothing itself. An earlier version did open
     it, and shipped a double open: it called window.open and fell back to a
     same-tab navigation whenever the open "looked blocked", but that check is
     impossible, because window.open with 'noopener' returns null even on
     success. The fallback fired every single time.

     Delegated on document in CAPTURE phase so the href is rewritten before any
     Vidalytics handler reads it, and so it covers the CTA no matter when the
     automation injects it, which is on a timer partway through the video.
     Nothing here runs unless the click landed on a Vidalytics CTA. */
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a[id^="vid_cta-"]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href) return;

    /* PREFILL. DORMANT as of 2026-08-18: the player's CTA points at /quiz, not
       Calendly, so isCalendly below is false and nothing is appended. quiz.html
       does the prefill now, when it builds the calendar URL at the end.

       Deliberately kept rather than deleted. It is the correct behaviour for the
       day someone repoints the CTA at Calendly in the Vidalytics dashboard, and
       it costs one parsed URL per click to leave in.

       Only ever added to a calendly.com URL. If the CTA is ever pointed
       somewhere else this leaves it untouched rather than leaking a name and
       an email address onto a third-party link. */
    /* Host is parsed, never pattern-matched against the whole URL. The first
       version tested /(^|\.)calendly\.com\//, which cannot match a full URL:
       the domain there is preceded by "//", not by start-of-string or a dot,
       so the prefill silently never applied. Parsing also means a lookalike
       host like calendly.com.evil.tld can never be treated as Calendly. */
    try {
      var u = new URL(href, location.href);
      var host = u.hostname.toLowerCase();
      var isCalendly = host === 'calendly.com' || host.slice(-13) === '.calendly.com';

      /* CARRY THE AD PARAMETERS ACROSS THE HOP. Added 2026-08-18.
         The CTA href is a bare .../quiz with no query string, so everything the ad
         put on the URL died here. That mattered most for a RETURNING visitor: the
         door's re-entry path forwards location.search to this page but does not
         re-run its submit handler, so ridley_lead_v1 still holds the utm_source
         from their FIRST visit. The quiz reads the stored lead, so the campaign
         that just paid for the click got no credit and the original one was
         credited twice.

         An allowlist, not the whole query string: this forwards named advertising
         parameters only, so nothing unexpected on this URL is ever propagated.
         The host test accepts our own origin plus ridleyacademy.team and
         pages.dev, because the dashboard href is absolute and does not always
         match the host the visitor happens to be on (custom domain vs preview).
         A strict same-origin test skipped the rewrite silently in exactly that
         case, which is the one hardest to notice.
         Existing values on the CTA win, so a parameter set deliberately in the
         Vidalytics dashboard is never overwritten. */
      var ours = u.origin === location.origin ||
                 /(^|\.)ridleyacademy\.team$/.test(host) ||
                 /(^|\.)pages\.dev$/.test(host);
      if (ours && /\/quiz(\.html)?$/.test(u.pathname)) {
        var here = new URLSearchParams(location.search);
        /* Widened 21 Aug 2026 to the full ra-attrib.js set, plus `pf`, the
           pre-frame split flag, so the variant can be switched on at the ad
           or link level and survive this hop. */
        ['utm_source','utm_medium','utm_campaign','utm_content','utm_term',
         'utm_id','fbclid','gclid','gbraid','wbraid','placement',
         'site_source_name','campaign_id','adset_id','ad_id','pf','el'
        ].forEach(function(k){
          var v = here.get(k);
          if (v && !u.searchParams.get(k)) u.searchParams.set(k, v);
        });
        href = u.pathname + u.search;
      }
      if (isCalendly && !/[?&]email=/.test(href)) {
        var lead = JSON.parse(localStorage.getItem('ridley_lead_v1') || '{}') || {};
        var add = [];
        if (lead.name)  add.push('name='  + encodeURIComponent(lead.name));
        if (lead.email) add.push('email=' + encodeURIComponent(lead.email));
        if (add.length) href += (href.indexOf('?') > -1 ? '&' : '?') + add.join('&');
      }
    } catch(_){}

    /* WE DO NOT OPEN ANYTHING. The href is rewritten and the anchor's own
       default does the single navigation.

       The previous version called preventDefault and then window.open, falling
       back to a same-tab navigation when the open looked blocked. That test can
       never work: window.open(url, name, 'noopener') returns NULL EVEN ON
       SUCCESS, because the caller is not allowed a reference to the new window.
       So the fallback fired every time and the visitor got the new tab AND this
       tab navigating: the double open Chris reported.

       Dropping target means one navigation in the current tab, which is also
       the most reliable outcome inside the Instagram and Facebook in-app
       browsers this funnel's traffic arrives in. Those webviews are unreliable
       with new windows and that was the original reason for the handler. They
       are not unreliable with a plain same-tab link. Leaving the video behind
       is the right trade at this point: they have watched it, and the only
       thing left to do is book. */
    a.setAttribute('href', href);
    a.removeAttribute('target');
    try {
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({event:'rdly_book_click', el:'vsl-player-cta'});
    } catch(_){}
  }, true);   /* capture: href is rewritten before any other handler reads it */

  try {
    window.dataLayer = window.dataLayer || [];
    dataLayer.push({event:'rdly_watch_view', lead_source:'simple-optin'});
  } catch(_){}
  try { if (window.fbq) fbq('track','ViewContent',{content_name:'Simple Funnel VSL'}); } catch(_){}

  /* ==========================================================================
     CTA TIMING + WATCH DEPTH (21 Aug 2026, EXECUTION-LIST item 4 / item 2).

     APPLY_CTA_REVEAL_SECONDS is the single number that decides when the apply
     CTA becomes visible, and it is the only thing to edit when the video
     changes. It is set for the 7:30 RECUT (VSL-ANALYSIS-20260818.md): first
     CTA at 4:02 = 242s, immediately after the qualifier that follows the
     coaches-and-community block. THE CTA MOVE AND THE RECUT SHIP TOGETHER.
     If this page ever deploys while the 15:30 master is still live, use 531
     (8:51, the end of the premium block) instead; on the current master 242
     lands mid-demo, before the pitch, which is the exact defect being fixed.

     PITCH_STARTS_SECONDS marks where the premium block begins, and exists so
     "pitch reached" can be a reported (and later bid-on) event. Recut: 3:20 =
     200s. Current 15:30 master: 464s.

     HOW THE GATE WORKS. Vidalytics injects its CTA on the dashboard timer
     (90s today); the CSS above keeps every vid_cta anchor hidden until the
     html element carries .ra-cta-open, which is added when the video's own
     currentTime crosses the reveal mark. Vidalytics renders a real HTML5
     <video> inside the embed div, so currentTime is read straight off it:
     pausing, scrubbing and rewatching are all handled by the element itself.

     FAILSAFE: if no video element can be found (a future player build could
     render differently), the gate opens on a wall-clock timer instead. The
     CTA is the only conversion path on this page; hiding it forever must be
     impossible.
     ======================================================================= */
  var APPLY_CTA_REVEAL_SECONDS = 242;
  var PITCH_STARTS_SECONDS = 200;

  function track(ev, extra){
    try {
      window.dataLayer = window.dataLayer || [];
      var p = { event: ev }; for (var k in (extra||{})) p[k] = extra[k];
      window.dataLayer.push(p);
    } catch(_){}
  }

  var ctaOpen = false;
  function openCta(how){
    if (ctaOpen) return;
    ctaOpen = true;
    document.documentElement.classList.add('ra-cta-open');
    track('rdly_cta_revealed', { at_seconds: APPLY_CTA_REVEAL_SECONDS, via: how });
  }

  var pitchReached = false, started = false, fired = {};
  function onTime(video){
    var t = video.currentTime || 0;
    if (!started && t > 0.5) {
      started = true;
      track('rdly_vsl_start', {});
      try { if (window.fbq) fbq('trackCustom','VSLStarted'); } catch(_){}
    }
    /* quartiles off the element's own duration, each fired once */
    var d = video.duration;
    if (d && isFinite(d) && d > 0) {
      [25,50,75].forEach(function(pc){
        if (!fired[pc] && t >= d * pc / 100) {
          fired[pc] = true;
          track('rdly_vsl_progress', { percent: pc });
          try { if (window.fbq) fbq('trackCustom','VSLProgress',{percent: pc}); } catch(_){}
        }
      });
    }
    if (!pitchReached && t >= PITCH_STARTS_SECONDS) {
      pitchReached = true;
      track('rdly_pitch_reached', { at_seconds: PITCH_STARTS_SECONDS });
      try { if (window.fbq) fbq('trackCustom','PitchReached'); } catch(_){}
    }
    if (t >= APPLY_CTA_REVEAL_SECONDS) openCta('video_time');
  }

  /* The player builds its DOM asynchronously, so poll for the video element
     rather than assuming when it exists. Two minutes of looking is generous;
     after that the wall-clock failsafe owns the gate. */
  var looked = 0;
  var finder = setInterval(function(){
    var video = document.querySelector('#vidalytics_embed_7pHY_IXbYK7t5bna video');
    if (video) {
      clearInterval(finder);
      video.addEventListener('timeupdate', function(){ onTime(video); });
    } else if (++looked > 240) {
      clearInterval(finder);
      setTimeout(function(){ openCta('wallclock_no_video'); },
                 APPLY_CTA_REVEAL_SECONDS * 1000);
    }
  }, 500);
})();
</script>
